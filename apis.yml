aid: inbotiqa
name: INBOTIQA
description: 'INBOTIQA is a UK-based fintech whose flagship product, YUDOmail, is an
  Intelligent Business Email and shared-mailbox management platform for high-volume
  group inboxes at banks, BPOs and financial-services operations teams. YUDOmail layers
  over Microsoft 365 and Google Workspace to turn incoming emails into assigned, trackable
  tasks with ownership, due dates, SLA tracking, machine-learning triage and sentiment
  analysis, audit trails and analytics, without replacing the underlying email platform.
  It deploys in the cloud or on-premises, integrates with Symphony chat and Microsoft
  Teams, and is used across KYC, FX, collateral, settlements and trade-support functions.
  INBOTIQA was a 2019 Barclays Accelerator (powered by Techstars) company.'
